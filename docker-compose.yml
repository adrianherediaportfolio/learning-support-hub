services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/learning_support.db
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-key-before-deployment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADAPTER_URL: ${ADAPTER_URL:-}
      ADAPTER_API_KEY: ${ADAPTER_API_KEY:-}
      PRACTICE_NAME: ${PRACTICE_NAME:-Gabinete Pedagógico}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "8001:8000"
    volumes:
      - support_data:/app/data
  adapter:
    profiles:
      - adapter
    build:
      context: ../easy-read-adapter/backend
    environment:
      PUBLIC_BASE_URL: ${ADAPTER_PUBLIC_BASE_URL:-http://localhost:8002}
    ports:
      - "8002:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  support_data:
