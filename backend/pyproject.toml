[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-support-hub"
version = "0.1.0"
description = "Case management for a pedagogical practice"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "PyJWT>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "email-validator>=2.2",
  "httpx>=0.27",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "pypdf>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
